[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-profile-arkalia"
version = "1.0.0"
description = "🌙 Système de gestion automatique du profil GitHub Arkalia Luna System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Arkalia Luna System", email = "arkalia.luna.system@gmail.com"}
]
keywords = ["github", "profile", "automation", "readme", "arkalia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Documentation",
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
# Scripts sont standalone, utiliser directement:
# python update-profile.py
# python auto-update-readme.py

[tool.setuptools]
# Scripts sont standalone, pas de packages
packages = []

[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = '''
^\._.*\.py$
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Même jeu de règles que le défaut historique (E4/E7/E9/F).
# Évite qu'une version Ruff plus récente n'active UP/DTZ et casse la CI.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["setuptools"]
ignore_missing_imports = true

